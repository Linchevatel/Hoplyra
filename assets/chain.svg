<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" fill="none">
  <rect width="900" height="120" rx="16" fill="#09091a" stroke="#27272a"/>
  <text x="450" y="28" text-anchor="middle" fill="#71717a" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em">CHAIN EXAMPLE</text>

  <g transform="translate(110 44)">
    <circle cx="36" cy="36" r="34" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="36" y="42" text-anchor="middle" fill="#67e8f9" font-family="JetBrains Mono,monospace" font-size="16" font-weight="700">AWG</text>
    <text x="36" y="58" text-anchor="middle" fill="#71717a" font-family="Inter,sans-serif" font-size="11">entry</text>
  </g>

  <path d="M190 80 H250" stroke="url(#arrow)" stroke-width="2" stroke-linecap="round"/>
  <polygon points="250,80 242,76 242,84" fill="#52525b"/>

  <g transform="translate(270 44)">
    <circle cx="36" cy="36" r="34" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.45"/>
    <text x="36" y="42" text-anchor="middle" fill="#c4b5fd" font-family="JetBrains Mono,monospace" font-size="16" font-weight="700">Tor</text>
    <text x="36" y="58" text-anchor="middle" fill="#71717a" font-family="Inter,sans-serif" font-size="11">middle</text>
  </g>

  <path d="M350 80 H410" stroke="url(#arrow)" stroke-width="2" stroke-linecap="round"/>
  <polygon points="410,80 402,76 402,84" fill="#52525b"/>

  <g transform="translate(430 44)">
    <circle cx="36" cy="36" r="34" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf" stroke-opacity="0.45"/>
    <text x="36" y="42" text-anchor="middle" fill="#5eead4" font-family="JetBrains Mono,monospace" font-size="16" font-weight="700">Xray</text>
    <text x="36" y="58" text-anchor="middle" fill="#71717a" font-family="Inter,sans-serif" font-size="11">exit</text>
  </g>

  <text x="620" y="52" fill="#a1a1aa" font-family="Inter,sans-serif" font-size="14">One client config</text>
  <text x="620" y="74" fill="#a1a1aa" font-family="Inter,sans-serif" font-size="14">for the whole chain</text>

  <defs>
    <linearGradient id="arrow" x1="190" y1="80" x2="250" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
</svg>
