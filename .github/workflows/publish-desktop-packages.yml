name: Publish Desktop Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ghcr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: oras-project/setup-oras@v1

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${GITHUB_REF_NAME:-}" ]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=1.3.2" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish Linux AppImage package
        env:
          VERSION: ${{ steps.ver.outputs.tag }}
        run: |
          oras push "ghcr.io/linchevatel/hoplyra-appimage:${VERSION}" \
            --artifact-type application/vnd.hoplyra.appimage \
            "desktop/dist/Hoplyra-${VERSION}-x86_64.AppImage:application/octet-stream" \
            "desktop/dist/README.txt:text/plain" \
            "desktop/dist/SHA256SUMS:text/plain"

      - name: Publish Windows portable package
        env:
          VERSION: ${{ steps.ver.outputs.tag }}
        run: |
          oras push "ghcr.io/linchevatel/hoplyra-windows:${VERSION}" \
            --artifact-type application/vnd.hoplyra.windows-portable \
            "desktop/dist/Hoplyra-${VERSION}-x64-portable.exe:application/octet-stream" \
            "desktop/dist/README.txt:text/plain" \
            "desktop/dist/SHA256SUMS:text/plain"

      - name: Publish latest tags
        env:
          VERSION: ${{ steps.ver.outputs.tag }}
        run: |
          oras tag "ghcr.io/linchevatel/hoplyra-appimage:${VERSION}" latest
          oras tag "ghcr.io/linchevatel/hoplyra-windows:${VERSION}" latest
