name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build PyInstaller backend binary
        run: |
          pyinstaller --noconfirm hoplyra-backend.spec
          mkdir -p desktop/resources/backend
          cp dist/hoplyra-backend desktop/resources/backend/
          chmod +x desktop/resources/backend/hoplyra-backend

      - name: Build Linux AppImage
        run: |
          cd desktop
          npm install
          npx electron-builder --linux AppImage --publish never

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-artifact
          path: desktop/dist/*.AppImage

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build PyInstaller backend binary
        run: |
          pyinstaller --noconfirm hoplyra-backend.spec
          mkdir -p desktop/resources/backend
          copy dist\hoplyra-backend.exe desktop\resources\backend\hoplyra-backend.exe

      - name: Build Windows Portable EXE
        run: |
          cd desktop
          npm install
          npx electron-builder --win portable --publish never

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: desktop/dist/*.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: appimage-artifact
          path: release-files/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-artifact
          path: release-files/

      - name: Generate Checksums & Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v1.3.4"
          fi

          cd release-files
          sha256sum * > SHA256SUMS
          cat << 'EOF' > README.txt
          Hoplyra Desktop Release

          Files:
          - Hoplyra-*-x86_64.AppImage (Linux x86_64)
          - Hoplyra-*-x64-portable.exe (Windows x64 portable)

          SHA256 checksums are available in SHA256SUMS.
          EOF
          gh release view "$TAG" 2>/dev/null || gh release create "$TAG" \
            --title "Hoplyra ${TAG#v}" \
            --notes-file README.txt
          gh release upload "$TAG" * --clobber
