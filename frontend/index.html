<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hoplyra — self-hosted VPN dashboard. Manage VPS servers, deploy WireGuard, AWG, OpenVPN, Xray, Tor, and multi-hop chains." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Hoplyra Dashboard</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      window.addEventListener(
        'error',
        function (e) {
          if (e.target && e.target.tagName === 'SCRIPT') {
            // Build DOM nodes; never inject markup into the document.
            var box = document.createElement('div')
            box.setAttribute(
              'style',
              'font-family:Inter,sans-serif;background:var(--color-surface-950,#0D1117);color:#e4e4e7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center',
            )
            var inner = document.createElement('div')
            var title = document.createElement('h1')
            title.setAttribute('style', 'font-size:20px;margin:0 0 12px')
            title.textContent = 'Hoplyra failed to load'
            var cache = document.createElement('p')
            cache.setAttribute('style', 'margin:0 0 8px;color:#a1a1aa')
            cache.textContent = 'Browser cache may be outdated after an update.'
            var hint = document.createElement('p')
            hint.setAttribute('style', 'margin:0;color:#71717a')
            hint.append('Press ')
            var key = document.createElement('b')
            key.textContent = 'Ctrl+Shift+R'
            hint.append(key, ' (or Cmd+Shift+R on Mac) to hard refresh.')
            inner.append(title, cache, hint)
            box.append(inner)
            document.body.replaceChildren(box)
          }
        },
        true,
      )
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
